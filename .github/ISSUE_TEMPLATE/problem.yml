name: Report a problem
description: A bug or unexpected behaviour of SpaceSonar (English or German)
title: "[Problem] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Thank you for the report. This issue is public: no personal data, no revealing file names, no screenshots with such content. You may write in English or German.
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Android
        - Windows
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Shown in the settings of the app.
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what happened instead?
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: The text contains no personal data I would not want to see in public.
          required: true
